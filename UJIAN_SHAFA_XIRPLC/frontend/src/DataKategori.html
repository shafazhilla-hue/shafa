<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peminjam Alat - DataKategori</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        .menu-transition {
            transition: background 0.3s ease, color 0.3s ease;
        }

        .btn-transition {
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn-transition:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="bg-gray-100 font-sans text-gray-700">

    <!-- LAYOUT -->
    <div class="flex min-h-screen relative">

        <!-- SIDEBAR -->
        <aside id="sidebar"
            class="w-56 bg-white border-r border-gray-200 shadow-sm fixed md:static inset-y-0 left-0 z-20">

            <nav class="py-4 mt-16 md:mt-0 font-medium">

    <a href="dashboard.html"
        class="block px-6 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
        DASHBOARD
    </a>

    <a href="DataKategori.html"
        class="block px-6 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
        DATA KATEGORI
    </a>

    <a href="DataAlat.html"
        class="block px-6 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
        DATA ALAT
    </a>

    <a href="TambahAlat.html"
        class="block px-6 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
        TAMBAH ALAT
    </a>

    <a href="Peminjaman.html"
        class="block px-6 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
        PEMINJAMAN
    </a>

    <a href="TambahPeminjaman.html"
        class="block px-6 py-3 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
        TAMBAH PEMINJAMAN
    </a>

</nav>

        </aside>


        <!-- CONTENT -->
        <main class="flex-1 p-4 md:p-8 w-full overflow-x-hidden">

            <!-- JUDUL -->
            <section class="mb-5">

                <h2 class="text-2xl md:text-3xl font-bold text-gray-800">
                    Kelola Kategori Alat
                </h2>

                <p class="text-gray-500 mt-1 text-sm md:text-base">
                    Kelola semua kategori yang tersedia.
                </p>

            </section>


            <!-- FORM TAMBAH KATEGORI -->
            <section class="bg-white rounded-xl shadow-md overflow-hidden mb-6">

                <div class="bg-blue-600 text-white px-6 py-4">

                    <h3 class="text-lg font-bold">
                        Tambah Kategori
                    </h3>

                </div>


                <div class="p-6">

                    <div class="flex flex-col md:flex-row gap-3">

                        <input
                            type="text"
                            id="namaKategori"
                            placeholder="Masukkan nama kategori"
                            class="flex-1 border border-gray-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                        >

                        <button
                            onclick="tambahKategori()"
                            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg btn-transition"
                        >
                            + Tambah Kategori
                        </button>

                    </div>

                </div>

            </section>


            <!-- TABEL SEMUA KATEGORI -->
            <section class="bg-white rounded-xl shadow-md overflow-hidden">

                <div class="bg-blue-600 text-white px-6 py-4">

                    <h3 class="text-lg font-bold">
                        Data Kategori
                    </h3>

                </div>


                <div class="p-6">

                    <!-- PENCARIAN -->
                    <div class="mb-5">

                        <input
                            type="text"
                            id="searchKategori"
                            onkeyup="cariKategori()"
                            placeholder="Cari kategori..."
                            class="w-full md:w-80 border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>


                    <!-- TABEL -->
                    <div class="overflow-x-auto">

                        <table class="w-full border-collapse">

                            <thead>

                                <tr class="bg-blue-50 text-blue-700">

                                    <th class="border px-4 py-3 text-left">
                                        No
                                    </th>

                                    <th class="border px-4 py-3 text-left">
                                        Nama Kategori
                                    </th>

                                    <th class="border px-4 py-3 text-center">
                                        Aksi
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="tabelKategori">

                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        // DATA KATEGORI
        let kategori = [];
async function loadKategori() {
    try {
        const response = await fetch("http://localhost:3000/api/kategori");

        if (!response.ok) {
            throw new Error("Gagal mengambil data kategori");
        }

        const data = await response.json();

        kategori = data.map(item => ({
            id: item.id_kategori,
            nama: item.nama_kategori
        }));

        tampilkanKategori();

    } catch (error) {
        console.error("Kategori gagal dimuat:", error);
        alert("Kategori gagal dimuat. Periksa backend dan database.");
    }
}

        // MENAMPILKAN DATA
        function tampilkanKategori(data = kategori) {

            const tabel = document.getElementById("tabelKategori");

            tabel.innerHTML = "";


            if (data.length === 0) {

                tabel.innerHTML = `
                    <tr>
                        <td colspan="3"
                            class="border px-4 py-6 text-center text-gray-500">
                            Tidak ada kategori.
                        </td>
                    </tr>
                `;

                return;
            }


            data.forEach((item, index) => {

                tabel.innerHTML += `

                    <tr class="hover:bg-blue-50">

                        <td class="border px-4 py-3">
                            ${index + 1}
                        </td>

                        <td class="border px-4 py-3 font-medium">
                            ${item.nama}
                        </td>

                        <td class="border px-4 py-3 text-center">

                            <button
                                onclick="editKategori(${item.id})"
                                class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg mr-2 btn-transition">
                                Edit
                            </button>

                            <button
                                onclick="hapusKategori(${item.id})"
                                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg btn-transition">
                                Hapus
                            </button>

                        </td>

                    </tr>

                `;

            });

        }


        // TAMBAH KATEGORI
        function tambahKategori() {

            const input =
                document.getElementById("namaKategori");

            const nama =
                input.value.trim();


            if (nama === "") {

                alert("Nama kategori harus diisi!");

                input.focus();

                return;
            }


            // CEK DUPLIKAT
            const sudahAda = kategori.some(
                item => item.nama.toLowerCase() === nama.toLowerCase()
            );


            if (sudahAda) {

                alert("Kategori tersebut sudah ada!");

                input.focus();

                return;
            }


            kategori.push({

                id: Date.now(),

                nama: nama

            });


            input.value = "";

            tampilkanKategori();

            alert("Kategori berhasil ditambahkan!");

        }


        // EDIT KATEGORI
        function editKategori(id) {

            const item =
                kategori.find(k => k.id === id);


            if (!item) {

                return;
            }


            const namaBaru =
                prompt(
                    "Masukkan nama kategori baru:",
                    item.nama
                );


            if (namaBaru === null) {

                return;
            }


            const nama =
                namaBaru.trim();


            if (nama === "") {

                alert("Nama kategori tidak boleh kosong!");

                return;
            }


            item.nama = nama;

            tampilkanKategori();

            alert("Kategori berhasil diubah!");

        }


        // HAPUS KATEGORI
        function hapusKategori(id) {

            const item =
                kategori.find(k => k.id === id);


            if (!item) {

                return;
            }


            const yakin =
                confirm(
                    "Apakah kamu yakin ingin menghapus kategori " +
                    item.nama +
                    "?"
                );


            if (!yakin) {

                return;
            }


            kategori =
                kategori.filter(k => k.id !== id);


            tampilkanKategori();

            alert("Kategori berhasil dihapus!");

        }


        // SEARCH
        function cariKategori() {

            const keyword =
                document
                    .getElementById("searchKategori")
                    .value
                    .toLowerCase();


            const hasil =
                kategori.filter(item =>
                    item.nama.toLowerCase().includes(keyword)
                );


            tampilkanKategori(hasil);

        }


        // TAMPILKAN SAAT HALAMAN DIBUKA
       loadKategori();

    </script>

</body>

</html>
